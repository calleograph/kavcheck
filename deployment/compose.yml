# Compose-описание ОДНОГО экземпляра KAV Checker. Запускать через scripts/*.sh (они задают --env-file и -p ${COMPOSE_PROJECT_NAME}).
# Порт наружу публикует только web (по умолчанию на loopback — за внешним reverse proxy с TLS). PostgreSQL не публикуется.
# Образы: по умолчанию готовые из реестра релизов (IMAGE_REPO:IMAGE_TAG); при отсутствии доступа к реестру — локальная сборка (scripts/update.sh --build).

name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-app-env: &app-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?}
  POSTGRES_USER: ${POSTGRES_USER:?}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:?}
  APP_MASTER_KEY: ${APP_MASTER_KEY:?}
  COOKIE_SECURE: ${COOKIE_SECURE:-auto}
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
  SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:-28800}
  SESSION_ABSOLUTE_TIMEOUT_SECONDS: ${SESSION_ABSOLUTE_TIMEOUT_SECONDS:-86400}
  KSC_MAX_ROWS: ${KSC_MAX_ROWS:-100000}
  KSC_CONCURRENCY: ${KSC_CONCURRENCY:-3}
  REPORT_CONCURRENCY: ${REPORT_CONCURRENCY:-2}
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-600}
  CACHE_SWR_SECONDS: ${CACHE_SWR_SECONDS:-3600}
  DOCS_ENABLED: ${DOCS_ENABLED:-false}
  DATA_DIR: /data

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    # Настройки под нагрузку приложения (таблицы данных зон, EOL и баз уязвимостей — гигабайты): значения из коробки (shared_buffers 128 МБ, work_mem 4 МБ) заставляют читать диск и сортировать на диске.
    # Размеры задаются переменными PG_*; контейнер ограничен POSTGRES_MEM_LIMIT, чтобы база не вытесняла приложение и систему.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - random_page_cost=1.1
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=2GB
      - -c
      - idle_in_transaction_session_timeout=300000
      - -c
      - log_min_duration_statement=${PG_LOG_SLOW_MS:-2000}
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
    shm_size: 256m
    mem_limit: ${POSTGRES_MEM_LIMIT:-2g}
    volumes:
      - ${DATA_ROOT:?DATA_ROOT is required}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s
    logging: *default-logging

  backend:
    image: ${IMAGE_REPO:-kavcheck}-backend:${IMAGE_TAG:?}
    build:
      context: ../backend
      args: { APP_VERSION: "${APP_VERSION:-0.0.0}", APP_GIT_COMMIT: "${APP_GIT_COMMIT:-unknown}", APP_BUILT_AT: "${APP_BUILT_AT:-unknown}", PIP_INDEX_URL: "${PIP_INDEX_URL:-}", PIP_INDEX_URLS: "${PIP_INDEX_URLS:-}" }
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *app-env
      MALLOC_ARENA_MAX: "2"
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    init: true
    volumes:
      - ${DATA_ROOT}/reports:/data/reports
      - ${DATA_ROOT}/updater:/data/updater
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    stop_grace_period: 20s
    logging: *default-logging

  worker:
    image: ${IMAGE_REPO:-kavcheck}-backend:${IMAGE_TAG:?}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *app-env
      MALLOC_ARENA_MAX: "2"                       # меньше арен glibc — меньше фрагментация и «раздувание» RSS при порционной обработке
    mem_limit: ${WORKER_MEM_LIMIT:-3g}            # страховка: фоновая служба сама удерживает память на 50 % (мягкий) и 75 % (жёсткий предел) этого значения
    memswap_limit: ${WORKER_MEM_LIMIT:-3g}        # без использования swap: при превышении контейнер перезапускается, а не загружает диск и систему
    oom_score_adj: 500                            # при нехватке памяти системой первым завершается worker (он сам перезапускается и продолжит задания), а не база и веб-интерфейс
    init: true
    command: ["python", "-m", "app.worker"]
    volumes:
      - ${DATA_ROOT}/reports:/data/reports
    healthcheck:                                  # пульс пишется раз в 30 секунд (app/services/system.py): нет пульса больше трёх минут — служба зависла
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/worker.alive -mmin -3 2>/dev/null)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    stop_grace_period: 60s
    logging: *default-logging

  web:
    image: ${IMAGE_REPO:-kavcheck}-web:${IMAGE_TAG:?}
    build:
      context: ../frontend
      args: { APP_VERSION: "${APP_VERSION:-0.0.0}", APP_GIT_COMMIT: "${APP_GIT_COMMIT:-unknown}", APP_BUILT_AT: "${APP_BUILT_AT:-unknown}", NPM_REGISTRY: "${NPM_REGISTRY:-}", NPM_REGISTRIES: "${NPM_REGISTRIES:-}" }
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "${WEB_BIND_ADDR:?}:${WEB_PORT:?}:8080/tcp"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging
