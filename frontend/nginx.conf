# Контейнер web: статика SPA + прокси /api/ к backend внутри сети compose. Имя backend резолвится динамически (resolver Docker).
map $http_x_forwarded_proto $xfp { default $http_x_forwarded_proto; "" $scheme; }

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server_tokens off;
    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /version.json { default_type application/json; add_header Cache-Control "no-store" always; try_files /version.json =404; }
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $xfp;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_read_timeout 300s;
    }
    location /fonts/ { add_header Cache-Control "public, max-age=604800"; add_header X-Content-Type-Options "nosniff" always; try_files $uri =404; }
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options "nosniff" always; try_files $uri =404; }
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
